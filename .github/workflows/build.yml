
name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Debug APK
        run: |
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        run: |
          APK=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::APK oluşturulamadı!"
            exit 1
          fi

          echo "APK başarıyla oluşturuldu: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Karui-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
