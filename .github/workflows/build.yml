
name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
- name: Build with Gradle
  run: ./gradlew build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'

      - name: Check Android Gradle project
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "::error::gradlew dosyası bulunamadı."
            exit 1
          fi

          if [ ! -f "./settings.gradle" ] && [ ! -f "./settings.gradle.kts" ]; then
            echo "::error::Gradle settings dosyası bulunamadı."
            exit 1
          fi

          chmod +x ./gradlew

      - name: Show Java version
        run: java -version

      - name: Clean and Build Debug APK
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug
        
      - name: Verify APK output
        run: |
          echo "Oluşturulan APK dosyaları:"

          find . -type f -path "*/build/outputs/apk/debug/*.apk" -print

          if ! find . -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit | grep -q .; then
            echo "::error::APK oluşturulamadı."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Karui-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
          
